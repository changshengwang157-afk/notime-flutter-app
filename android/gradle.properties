org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Windows: avoid errno 32 when Flutter copies assets into build/ in parallel.
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.vfs.watch=false
org.gradle.caching=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Project on E: drive + Pub cache on C: — disable Kotlin incremental compile (avoids
# "different roots" failure in mobile_scanner :compileDebugKotlin).
kotlin.incremental=false
kotlin.incremental.android=false
kotlin.compiler.execution.strategy=in-process
