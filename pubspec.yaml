name: notime_app
description: NotiMe mobile app UI prototype (mock data, no backend).
publish_to: "none"
version: 0.1.0+26

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  brick_bootstrap5_plus: ^1.1.1
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  intl: ^0.20.2
  camera: ^0.11.3
  google_mlkit_barcode_scanning: ^0.14.1
  google_mlkit_commons: ^0.11.1
  provider: ^6.1.2
  url_launcher: ^6.3.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1
  app_links: ^6.4.0
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/notime_logo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/notime_logo.png
    - assets/images/notification_1.png
    - assets/images/notification_2.png
    - assets/images/notification_3.png
    - assets/images/notification_4.png
