name: notime_app
description: NotiMe mobile app UI prototype (mock data, no backend).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  brick_bootstrap5_plus: ^1.1.1
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  intl: ^0.20.2
  mobile_scanner: ^7.0.0
  provider: ^6.1.2
  url_launcher: ^6.3.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  app_links: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/notime_logo.png
    - assets/images/scratchify_logo.png
    - assets/images/notification_1.png
    - assets/images/notification_2.png
    - assets/images/notification_3.png
    - assets/images/notification_4.png
